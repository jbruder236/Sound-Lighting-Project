# Keep Bluetooth audio available without a desktop login.
wireplumber.profiles = {
  main = { monitor.bluez.seat-monitoring = disabled }
}
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink ]
}
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_input.*" } ]
    actions = {
      update-props = {
        bluez5.media-source-role = "playback"
        target.object = "lighting_audio"
        node.dont-fallback = true
      }
    }
  }
]
