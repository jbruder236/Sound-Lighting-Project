# A stable Bluetooth playback destination, independent of USB/HDMI hardware.
context.objects = [
  { factory = adapter
    args = {
      factory.name = support.null-audio-sink
      node.name = lighting_audio
      node.description = "Lighting Audio"
      media.class = Audio/Sink
      audio.position = [ FL FR ]
      monitor.channel-volumes = false
      priority.session = 2000
    }
  }
]
